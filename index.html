<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Translation Practice Online</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
</head>
<body>
<style>
/* Layout: a slim control bar, three model tabs, one chunk-sized card at a time (stepper), results appear under the card */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --fg:#1B2333; --muted:#5B6577; --line:#DCE1EB; --accent:#2F5F9E; --on-accent:#FFFFFF;
  --good:#1F7A4F; --warn:#9A6208; --bad:#B03F25;
  --brk:#4A7FC1; --ctx:#E8A33D; --cog:#52B788; --ff:#E76F51; --grm:#7B68EE; --skl:#C0508A;
  --font-ui:'Figtree',system-ui,sans-serif; --font-fr:'Newsreader',Georgia,serif;
}
:root{
  --brk-t:color-mix(in srgb,var(--brk) 16%,var(--surface)); --brk-d:color-mix(in srgb,var(--brk) 55%,var(--fg));
  --ctx-t:color-mix(in srgb,var(--ctx) 18%,var(--surface)); --ctx-d:color-mix(in srgb,var(--ctx) 50%,var(--fg));
  --cog-t:color-mix(in srgb,var(--cog) 18%,var(--surface)); --cog-d:color-mix(in srgb,var(--cog) 50%,var(--fg));
  --ff-t:color-mix(in srgb,var(--ff) 16%,var(--surface)); --ff-d:color-mix(in srgb,var(--ff) 55%,var(--fg));
  --grm-t:color-mix(in srgb,var(--grm) 16%,var(--surface)); --grm-d:color-mix(in srgb,var(--grm) 55%,var(--fg));
  --skl-t:color-mix(in srgb,var(--skl) 16%,var(--surface)); --skl-d:color-mix(in srgb,var(--skl) 55%,var(--fg));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151C; --surface:#1B2029; --fg:#E8EBF2; --muted:#A3ACBD; --line:#2D3445; --accent:#8FB0F0; --on-accent:#10131A;
  --good:#6FD0A0; --warn:#F0B955; --bad:#FF8A70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151C; --surface:#1B2029; --fg:#E8EBF2; --muted:#A3ACBD; --line:#2D3445; --accent:#8FB0F0; --on-accent:#10131A;
  --good:#6FD0A0; --warn:#F0B955; --bg2:#000; --bad:#FF8A70; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.5;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--font-fr);font-weight:600;font-size:clamp(26px,5vw,36px);line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.s-BRK{--c:var(--brk);--t:var(--brk-t);--d:var(--brk-d)}.s-CTX{--c:var(--ctx);--t:var(--ctx-t);--d:var(--ctx-d)}
.s-COG{--c:var(--cog);--t:var(--cog-t);--d:var(--cog-d)}.s-FF{--c:var(--ff);--t:var(--ff-t);--d:var(--ff-d)}
.s-GRM{--c:var(--grm);--t:var(--grm-t);--d:var(--grm-d)}.s-SKL{--c:var(--skl);--t:var(--skl-t);--d:var(--skl-d)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 16px;border-radius:10px;cursor:pointer;text-align:left;flex:1 1 220px;min-width:0}
.tab small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tab:focus-visible,button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px}
.bar b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--fg);padding:6px 12px;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.bar label{display:flex;gap:8px;align-items:center;cursor:pointer}
.modehelp{flex-basis:100%;color:var(--muted);font-size:14px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--muted);font:600 12px var(--font-ui);cursor:pointer;padding:0}
.dot[aria-current="true"]{border-color:var(--accent);color:var(--fg)}
.dot.full{background:var(--good);border-color:var(--good);color:var(--surface)}
.dot.part{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.dot.low{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.score{font-weight:600;font-variant-numeric:tabular-nums}
.fr{font-family:var(--font-fr);font-size:clamp(22px,4vw,30px);line-height:1.55;margin:0;text-wrap:pretty}
.fr mark{background:var(--t);color:inherit;border-bottom:3px solid var(--c);padding:0 3px;border-radius:3px;cursor:default}
.fr mark sup{font:700 11px var(--font-ui);color:var(--d);margin-left:2px}
.ctxline{font-family:var(--font-fr);color:var(--muted);font-size:16px;margin:0}
.ctxline b{color:var(--fg);font-weight:600}
textarea{width:100%;min-height:84px;font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);resize:vertical}
.hints{display:flex;flex-direction:column;gap:8px}
.hint{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:15px;border:1.5px solid var(--c);background:var(--t);color:var(--fg);padding:9px 12px;border-radius:12px;cursor:pointer}
.hint .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--c);color:#14181f;font:700 13px/24px var(--font-ui);text-align:center}
.hint .lab{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--d)}
.hint.locked{border-style:dashed;background:transparent}
.hint.locked .txt{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);padding:10px 18px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.res{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.pt{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:baseline;padding:10px 12px;border-radius:10px;background:var(--t);border-left:5px solid var(--c)}
.pt .seg-fr{font-family:var(--font-fr);font-size:19px;font-weight:600;min-width:0}
.pt .st{font-weight:700;font-size:14px;white-space:nowrap}
.pt.ok .st{color:var(--good)}.pt.part .st{color:var(--warn)}.pt.no .st{color:var(--bad)}
.pt .why{grid-column:1/-1;font-size:14px;color:var(--muted)}
.pt .why b{color:var(--fg);font-weight:600}
.model{border-top:1px solid var(--line);padding-top:12px}
.model p{margin:2px 0 0;font-family:var(--font-fr);font-size:20px}
.model span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.note{font-size:14px;color:var(--muted);margin:0}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{font:inherit;font-size:18px;font-family:var(--font-fr);border:1.5px solid var(--line);border-bottom-width:3px;background:var(--bg);color:var(--fg);padding:6px 12px;border-radius:9px;cursor:pointer}
.tile.used{opacity:.3;pointer-events:none}
.answer{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.answer .tile{background:var(--surface);border-color:var(--accent)}
.answer .ph{color:var(--muted);font-size:15px}
.strat{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.sbtn{font:inherit;font-weight:600;font-size:15px;border:1.5px solid var(--c);background:var(--t);color:var(--fg);padding:12px;border-radius:10px;cursor:pointer;text-align:left;display:flex;gap:8px;align-items:center}
.sbtn i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.sbtn:disabled{cursor:default;opacity:.55}
.sbtn.right{opacity:1;box-shadow:0 0 0 3px var(--good)}
.sbtn.wrong{opacity:1;box-shadow:0 0 0 3px var(--bad)}
.sbtn.close{opacity:1;box-shadow:0 0 0 3px var(--warn)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar2{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.bar2 .track{height:12px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar2 .fill{height:100%;background:var(--c)}
@media(max-width:520px){.bar2{grid-template-columns:110px 1fr 40px}}
.foot{color:var(--muted);font-size:14px;max-width:70ch}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .5s}}
.hdr{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.snd{font:inherit;font-weight:600;font-size:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.snd[aria-pressed="false"]{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tcard{font:inherit;text-align:left;background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.tcard:hover{border-color:var(--accent)}
.tcard .no{font:600 12px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tcard h2{font-family:var(--font-fr);font-size:22px;line-height:1.2;margin:0;font-weight:600;text-wrap:balance}
.tcard p{margin:0;font-size:14px;color:var(--muted)}
.tcard .meta{margin-top:auto;padding-top:8px;font-size:13px;display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.tcard .meter{height:6px;border-radius:3px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.tcard .meter span{display:block;height:100%;background:var(--good)}
.back{font:inherit;font-weight:600;border:0;background:transparent;color:var(--accent);padding:4px 0;cursor:pointer;text-align:left}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.rv{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.rv{grid-template-columns:1fr}}
.rv .col{border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0;background:var(--bg)}
.rv .key{border-color:var(--good)}
.rv h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rv .key h4{color:var(--good)}
.mytxt{font-family:var(--font-fr);font-size:20px;margin:0;line-height:1.45;overflow-wrap:anywhere}
.ans-blk+.ans-blk{margin-top:12px}.ans-blk .lbl{font-size:12px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13px;font-weight:700;padding:2px 9px;border-radius:12px;background:var(--t);border:1.5px solid var(--c);color:var(--d)}
.chip.no{opacity:.65;text-decoration:line-through}
.kp{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.kp li{padding:5px 8px;border-left:4px solid var(--c);background:var(--t);border-radius:6px}
.kp .kn{font-weight:700;color:var(--d)}
</style>
<div class="wrap">
  <header id="head"></header>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="bar" id="bar">
    <span><b>Auto-marking</b></span>
    <span class="seg" id="mode"></span>
    <label><input type="checkbox" id="cost" checked> Opening a hint costs 0.25</label>
    <p class="modehelp" id="modehelp"></p>
  </div>
  <main id="stage"></main>
  <p class="foot">Accepted answers are lists written for each hint point. Marking works on meaning points, so any valid wording that covers a point scores.</p>
</div>
<script>
const TEXTS=[{"id": "pantalon", "name": "Le pantalon bleu", "gist": "A shopper orders black trousers online but receives blue ones, and has to buy them anyway.", "chunks": [{"parts": [["D’habitude, j’achète", 1], " très peu en ligne,"], "en": "Usually, I buy very little online,", "pts": [{"n": 1, "st": "GRM", "hint": "D’habitude points to a habit, so use the present tense.", "seg": "D’habitude, j’achète", "ok": ["usually i buy", "normally i buy", "i usually buy", "i normally buy", "as a rule i buy", "i generally buy", "generally i buy", "i tend to buy"], "part": []}]}, {"parts": ["mais ", ["mercredi dernier", 2], ", j’ai ", ["commandé", 3], " ", ["un pantalon", 4], " ", ["par internet", 5]], "en": "but last Wednesday I ordered a pair of trousers on the internet", "pts": [{"n": 2, "st": "GRM", "hint": "Mercredi dernier is a past time marker, so use a past tense.", "seg": "mercredi dernier", "ok": ["last wednesday", "on wednesday last week", "wednesday last week", "this past wednesday"], "part": []}, {"n": 3, "st": "FF", "hint": "Looks like “to command”, but commander means to order.", "seg": "commandé", "ok": ["ordered", "i ordered", "placed an order for", "have ordered", "had ordered"], "part": []}, {"n": 4, "st": "SKL", "hint": "Pantalon is singular in French. Is it in English?", "seg": "un pantalon", "ok": ["a pair of trousers", "a pair of pants", "trousers", "pants", "a pair of slacks"], "part": []}, {"n": 5, "st": "SKL", "hint": "Do not translate word for word.", "seg": "par internet", "ok": ["on the internet", "online", "over the internet", "via the internet", "through the internet", "on the web"], "part": []}]}, {"parts": ["parce que ", ["je n’avais pas", 6], " ", ["le temps", 7], " ", ["d’aller en ville", 8], "."], "en": "because I did not have time to go into town.", "pts": [{"n": 6, "st": "GRM", "hint": "N’avais is the imperfect, a past situation.", "seg": "je n’avais pas", "ok": ["i did not have", "i didn't have", "i had no", "i hadn't", "i had not", "i lacked"], "part": []}, {"n": 7, "st": "SKL", "hint": "Is the word le needed in English?", "seg": "le temps", "ok": ["time", "the time", "enough time", "any time"], "part": []}, {"n": 8, "st": "SKL", "hint": "French says en ville, with no word for “into”.", "seg": "d’aller en ville", "ok": ["to go into town", "to go to town", "to go into the city", "to go downtown", "to go to the city", "to go into the town", "to head into town", "to go to the shops"], "part": []}]}, {"parts": [["J’avais besoin", 9], " d’un ", ["pantalon noir", 10], ", ", ["de taille 42", 11], ", pour aller à un ", ["événement spécial", 12], "."], "en": "I needed black trousers, size 42, to go to a special event.", "pts": [{"n": 9, "st": "GRM", "hint": "J’avais besoin: imperfect, a need in the past.", "seg": "J’avais besoin", "ok": ["i needed", "i had needed", "i was in need of", "i needed a", "i did need"], "part": []}, {"n": 10, "st": "BRK", "hint": "In French the adjective usually comes after the noun.", "seg": "pantalon noir", "ok": ["black trousers", "black pants", "a pair of black trousers", "a pair of black pants", "black slacks"], "part": []}, {"n": 11, "st": "CTX", "hint": "A number after taille can only be a clothing size.", "seg": "de taille 42", "ok": ["size 42", "of size 42", "in size 42", "a size 42", "size forty-two"], "part": []}, {"n": 12, "st": "COG", "hint": "Near cognates: événement, spécial.", "seg": "événement spécial", "ok": ["special event", "special occasion", "special function", "particular event", "important event", "special party"], "part": []}]}, {"parts": ["J’ai ", ["sélectionné", 13], " un ", ["site", 14], " ", ["sécurisé", 13], "."], "en": "I selected a secure website.", "pts": [{"n": 13, "st": "COG", "hint": "Near cognates: sélectionner, sécurisé.", "seg": "sélectionné … sécurisé", "ok": ["selected", "secure", "chose", "picked", "chosen", "safe"], "part": []}, {"n": 14, "st": "CTX", "hint": "A secure site that you order from online is a…", "seg": "site", "ok": ["website     return `<button class="hint s-${p.st} ${o?'':'locked'}" data-hint="${k}"><span class="n">${p.n}</span><span><span class="lab">${S[p.st]}</span><br><span class="txt">${o?esc(p.hint):'Tap to open this hint'+(cost?' (−0.25)':'')}</span></span></button>`}).join('');
  return `<div class="card">
   <div class="top">${dots('translate',AA())}${total(AA())}</div>
   ${prev?`<p class="ctxline">Before: ${esc(prev)}</p>`:''}
   <p class="fr">${fr(c)}</p>
   <div class="hints">${hints}</div>
   <textarea id="ans" placeholder="Type your English translation of this chunk" aria-label="Your translation">${esc(a.txt)}</textarea>
   <div class="row"><button class="btn" data-check>Check</button>
     <button class="btn ghost" data-nav="-1" ${i===0?'disabled':''}>Back</button>
     ${i===CH.length-1?'<button class="btn ghost" data-tab="review">Finish and compare</button>':`<button class="btn ghost" data-nav="1">Next chunk</button>`}</div>
   ${a.res?`<div class="res">${a.res.rows}<div class="model"><span>Model translation</span><p>${esc(c.en)}</p></div>
   <p class="note">Marked on meaning points, not on word-for-word match. Any wording that covers each numbered point scores.</p></div>`:''}
  </div>`}

/* ---------- Model 2 ---------- */
function viewTiles(){
  const CH=cur.chunks,i=CIX().tiles,c=CH[i],b=BB()[i];if(!b.tiles)b.tiles=tilesFor(cur,i);
  return `<div class="card">
   <div class="top">${dots('tiles',BB())}${total(BB())}</div>
   <p class="fr">${fr(c)}</p>
   <div class="answer" aria-label="Your sentence">${b.used.length?b.used.map((k,j)=>`<button class="tile" data-undo="${j}">${esc(b.tiles[k])}</button>`).join(''):'<span class="ph">Tap words below to build the translation. Tap a placed word to remove it.</span>'}</div>
   <div class="tiles">${b.tiles.map((t,k)=>`<button class="tile ${b.used.includes(k)?'used':''}" data-tile="${k}">${esc(t)}</button>`).join('')}</div>
   <div class="row"><button class="btn" data-check2 ${b.used.length?'':'disabled'}>Check</button>
     <button class="btn ghost" data-clear>Clear</button>
     <button class="btn ghost" data-nav="-1" ${i===0?'disabled':''}>Back</button>
     ${i===CH.length-1?'<button class="btn ghost" data-tab="review">Finish and compare</button>':`<button class="btn ghost" data-nav="1">Next chunk</button>`}</div>
   ${b.res?`<div class="res">${b.res.exact?`<p class="note"><b style="color:var(--good)">Same as the model sentence.</b></p>`:`<p class="note">Different from the model, so each point was checked on its own. A valid alternative still scores.</p>`}${b.res.rows}<div class="model"><span>Model translation</span><p>${esc(c.en)}</p></div></div>`:''}
  </div>`}

/* ---------- Model 3 ---------- */
const CLOSE={COG:'FF',FF:'COG'};
function viewStrat(){
  const C=CC(),Q=ens(cur).Q;
  if(C.i>=Q.length){const by={};Object.keys(S).forEach(k=>by[k]={s:0,t:0});
    C.ans.forEach((a,k)=>{const st=Q[k].p.st;by[st].t++;by[st].s+=a.s});
    const tot=C.ans.reduce((x,a)=>x+a.s,0);
    return `<div class="card"><div class="top"><b>Your strategy profile</b><span class="score">${tot} / ${Q.length}</span></div>
    <div class="bars">${Object.keys(S).filter(k=>by[k].t).map(k=>{const v=by[k],pc=Math.round(100*v.s/v.t);
      return `<div class="bar2 s-${k}"><span>${S[k]}</span><span class="track"><span class="fill" style="display:block;width:${pc}%"></span></span><span>${v.s}/${v.t}</span></div>`}).join('')}</div>
    <p class="note">A teacher view of the same profile would show which strategy the class needs next.</p>
    <div class="row"><button class="btn" data-restart>Play again</button></div></div>`}
  const q=Q[C.i],a=C.ans[C.i],c=cur.chunks[q.ci];
  const btns=Object.keys(S).map(k=>{let cl='';
    if(a){if(k===q.p.st)cl='right';else if(k===a.pick)cl=a.s===.5?'close':'wrong'}
    return `<button class="sbtn s-${k} ${cl}" data-pick="${k}" ${a?'disabled':''}><i></i>${S[k]}</button>`}).join('');
  const sc=C.ans.reduce((x,y)=>x+y.s,0);
  return `<div class="card"><div class="top"><span class="score">Point ${C.i+1} of ${Q.length}</span><span class="score">${sc} correct</span></div>
   <p class="fr">${fr(c,q.p.n)}</p>
   <p class="note">Which strategy helps you translate the highlighted words?</p>
   <div class="strat">${btns}</div>
   ${a?`<div class="res"><div class="pt ${a.s===1?'ok':a.s?'part':'no'} s-${q.p.st}"><span></span><span class="seg-fr">${esc(q.p.seg)}</span><span class="st">${a.s===1?'Correct':a.s?'Close, half a point':'Not this one'}</span>
   <span class="why"><b>${S[q.p.st]}.</b> ${esc(q.p.hint)} Possible English: <b>${esc(q.p.ok[0])}</b>.${a.s===.5?' Cognates and false friends are both look-alike words, so this is accepted as close.':''}</span></div>
   <div class="row"><button class="btn" data-snext>${C.i===Q.length-1?'See my profile':'Next point'}</button></div></div>`:''}
  </div>`}


/* ---------- Review: child's work beside the answer key ---------- */
function hl(text,raws,pts){
  const lo=text.toLowerCase(),rg=[];
  pts.forEach((p,i)=>{const r=raws[i];if(r&&r.s>0&&r.v){const k=lo.indexOf(r.v.toLowerCase());if(k>=0)rg.push([k,k+r.v.length,p.st])}});
  rg.sort((a,b)=>a[0]-b[0]);let out='',cur2=0;
  rg.forEach(([a,b,st])=>{if(a<cur2)return;out+=esc(text.slice(cur2,a))+`<mark class="s-${st}" style="background:var(--t);border-bottom:3px solid var(--c);padding:0 2px;border-radius:3px;color:inherit">${esc(text.slice(a,b))}</mark>`;cur2=b});
  return out+esc(text.slice(cur2))}
function chips(c,raws){return `<div class="chips">${c.pts.map((p,i)=>{const s=raws?raws[i].s:0;const cl=s===1?'ok':s?'part':'no';
  return `<span class="chip s-${p.st} ${cl}" title="${esc(p.seg)}">${p.n} ${s===1?'✓':s?'~':'✗'}</span>`}).join('')}</div>`}
function mine(c,a,b){
  let out='';
  if(a.res&&a.txt.trim())out+=`<div class="ans-blk"><span class="lbl">Typed</span><p class="mytxt">${hl(a.txt,a.lastRaw,c.pts)}</p>${chips(c,a.lastRaw)}</div>`;
  if(b.res&&b.used.length)out+=`<div class="ans-blk"><span class="lbl">Built with tiles</span><p class="mytxt">${esc(b.used.map(k=>b.tiles[k]).join(' '))}</p>${chips(c,b.raw)}</div>`;
  if(!out){const typed=a.txt.trim();out=typed?`<div class="ans-blk"><span class="lbl">Typed, not checked</span><p class="mytxt">${esc(typed)}</p></div>`:'<p class="note">Not attempted yet.</p>'}
  return out}
function viewReview(){
  const CH=cur.chunks,A=AA(),B=BB();
  let got=0,max=0,done=0;
  CH.forEach((c,i)=>{const r=A[i].res||B[i].res;if(r){done++;got+=Math.max(A[i].res?A[i].res.tot:0,B[i].res?B[i].res.tot:0);max+=c.pts.length}});
  const sum=`<div class="card"><div class="top"><b>Your work and the answer key</b><span class="score">${+got.toFixed(2)} / ${max} marks on ${done} of ${CH.length} chunks</span></div>
   <p class="note">✓ matched the key, ~ close, ✗ missed. Coloured words in your answer are the parts that earned a point. If you used both activities, each answer is shown.</p></div>`;
  const cards=CH.map((c,i)=>{
    const keypts=c.pts.map(p=>`<li class="s-${p.st}"><span class="kn">${p.n}</span> <b>${esc(p.seg)}</b> → ${esc(p.ok.slice(0,3).join(' / '))}</li>`).join('');
    return `<div class="card"><div class="top"><span class="score">Chunk ${i+1}</span><button class="btn ghost" data-jump="${i}" style="padding:6px 12px">Practise this chunk</button></div>
    <p class="fr" style="font-size:22px">${fr(c)}</p>
    <div class="rv"><div class="col"><h4>Your work</h4>${mine(c,A[i],B[i])}</div>
    <div class="col key"><h4>Answer key</h4><p class="mytxt">${esc(c.en)}</p><ul class="kp">${keypts}</ul></div></div></div>`}).join('');
  return sum+cards}

/* ---------- shell ---------- */
const TABS=[['translate','Translate and check','Type it, auto-marked on key points'],['tiles','Word tiles','Tap to build, phone friendly'],['strategy','Strategy detective','Name the strategy, get a profile'],['review','My work vs key','Side by side with the answer key']];
function progress(t){const s=ST[t.id];if(!s)return 0;const n=s.A.filter(a=>a.res).length;return Math.round(100*n/t.chunks.length)}
function renderHome(){
  $('head').innerHTML=`<div class="hdr"><div><h1>Translation Practice Online</h1><p class="sub">Sixteen French passages from the Presentation 3 series. Pick one, then choose how to practise it. Every activity marks itself.</p></div>${sndBtn()}</div>`;
  $('tabs').hidden=true;$('bar').hidden=true;
  $('stage').innerHTML=`<div class="grid">${TEXTS.map((t,i)=>{const np=t.chunks.reduce((x,c)=>x+c.pts.length,0),p=progress(t);
    return `<button class="tcard" data-open="${t.id}"><span class="no">Text ${i+1}</span><h2>${esc(t.name)}</h2><p>${esc(t.gist)}</p>
    <span class="meter" aria-hidden="true"><span style="width:${p}%"></span></span>
    <span class="meta"><span>${t.chunks.length} chunks, ${np} hint points</span><span>${p?p+'% checked':'Not started'}</span></span></button>`}).join('')}</div>`}
function sndBtn(){return `<button class="snd" id="snd" aria-pressed="${soundOn}" data-snd>${soundOn?'Sound on':'Sound off'}</button>`}
function renderText(){
  $('head').innerHTML=`<div class="hdr"><div><button class="back" data-home>← All texts</button><h1>${esc(cur.name)}</h1><p class="sub">${esc(cur.gist)}</p></div>${sndBtn()}</div>`;
  $('tabs').hidden=false;
  $('tabs').innerHTML=TABS.map(t=>`<button class="tab" role="tab" aria-selected="${t[0]===tab}" data-tab="${t[0]}">${t[1]}<small>${t[2]}</small></button>`).join('');
  $('mode').innerHTML=Object.keys(MODES).map(k=>`<button aria-pressed="${k===mode}" data-mode="${k}">${MODES[k][0]}</button>`).join('');
  $('modehelp').textContent=MODES[mode][1];$('cost').checked=cost;$('bar').hidden=tab==='strategy'||tab==='review';
  $('stage').innerHTML=tab==='translate'?viewTranslate():tab==='tiles'?viewTiles():tab==='review'?viewReview():viewStrat()}
function render(){if(cur)renderText();else renderHome()}
function check1(){const i=CIX().translate,a=AA()[i],c=cur.chunks[i];a.txt=$('ans').value;
  a.lastRaw=c.pts.map(p=>mark(a.txt,p,mode));a.res=points(c,a.lastRaw,a.hints);ding(a.res.tot/c.pts.length)}
function check2(){const i=CIX().tiles,b=BB()[i],c=cur.chunks[i];const txt=b.used.map(k=>b.tiles[k]).join(' ');
  const r=c.pts.map(p=>mark(txt,p,mode));const o=points(c,r,null);o.exact=norm(txt)===norm(c.en);b.raw=r;b.res=o;ding(o.tot/c.pts.length)}
function saveTxt(){if(cur&&tab==='translate'&&$('ans'))AA()[CIX().translate].txt=$('ans').value}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const k=t.dataset;
  if(t.hasAttribute('data-snd')){soundOn=!soundOn;try{localStorage.setItem('fwh-sound',soundOn?'on':'off')}catch(e){}if(soundOn)sfx.ok();render();return}
  if(k.open){saveTxt();location.hash=k.open+'-translate';return}
  if(t.hasAttribute('data-home')){saveTxt();location.hash='home';return}
  if(k.tab){saveTxt();location.hash=cur.id+'-'+k.tab;return}
  if(k.mode){mode=k.mode;
    AA().forEach((a,i)=>{if(a.res){a.lastRaw=cur.chunks[i].pts.map(p=>mark(a.txt,p,mode));a.res=points(cur.chunks[i],a.lastRaw,a.hints)}});
    BB().forEach((b,i)=>{if(b.res){const txt=b.used.map(x=>b.tiles[x]).join(' ');b.raw=cur.chunks[i].pts.map(p=>mark(txt,p,mode));const o=points(cur.chunks[i],b.raw,null);o.exact=b.res.exact;b.res=o}});
    render();return}
  if(k.jump!==undefined){saveTxt();CIX().translate=+k.jump;CIX().tiles=+k.jump;location.hash=cur.id+'-translate';return}
  if(k.go!==undefined){saveTxt();CIX()[tab]=+k.go;render()}
  else if(k.nav){saveTxt();CIX()[tab]+=+k.nav;render()}
  else if(k.hint!==undefined){const a=AA()[CIX().translate];a.txt=$('ans').value;a.hints.add(+k.hint);sfx.tick();if(a.res){a.lastRaw=a.lastRaw;a.res=points(cur.chunks[CIX().translate],a.lastRaw,a.hints)}render()}
  else if(t.hasAttribute('data-check')){check1();render()}
  else if(k.tile!==undefined){const b=BB()[CIX().tiles];b.used.push(+k.tile);b.res=null;sfx.tick();render()}
  else if(k.undo!==undefined){const b=BB()[CIX().tiles];b.used.splice(+k.undo,1);b.res=null;render()}
  else if(t.hasAttribute('data-clear')){const b=BB()[CIX().tiles];b.used=[];b.res=null;render()}
  else if(t.hasAttribute('data-check2')){check2();render()}
  else if(k.pick){const C=CC(),q=ens(cur).Q[C.i];const s=k.pick===q.p.st?1:(CLOSE[q.p.st]===k.pick?.5:0);C.ans[C.i]={pick:k.pick,s};s===1?sfx.good():s?sfx.ok():sfx.bad();render()}
  else if(t.hasAttribute('data-snext')){const C=CC();C.i++;if(C.i>=ens(cur).Q.length){const tot=C.ans.reduce((x,y)=>x+y.s,0);if(tot/C.ans.length>=.8)sfx.win()}render()}
  else if(t.hasAttribute('data-restart')){const C=CC();C.i=0;C.ans=[];render()}
});
$('cost').addEventListener('change',e=>{cost=e.target.checked;if(cur){AA().forEach((a,i)=>{if(a.res)a.res=points(cur.chunks[i],a.lastRaw,a.hints)});render()}});
function fromHash(){const h=location.hash.slice(1);
  if(!h||h==='home'){cur=null}
  else{const k=h.lastIndexOf('-');const id=k>0?h.slice(0,k):h,tb=k>0?h.slice(k+1):'translate';
    const t=TEXTS.find(x=>x.id===id);if(t){cur=t;tab=['translate','tiles','strategy','review'].includes(tb)?tb:'translate'}else cur=null}
  render();window.scrollTo(0,0)}
window.addEventListener('hashchange',fromHash);fromHash();

</script>
</body>
</html>
